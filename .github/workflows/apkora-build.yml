# apkora-workflow v1
name: Apkora Build
on:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle tasks
        required: false
        default: assembleDebug
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        env:
          TASK: ${{ github.event.inputs.task || 'assembleDebug' }}
        run: gradle $TASK --no-daemon --stacktrace
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
